minimumReleaseAge: 11520
minimumReleaseAgeExclude:
  - "@every-app/*"

# Security floors (2026-10) for transitive deps whose parents haven't shipped a
# bump yet. Major-bounded (^) so an override never forces a new major. Prune a
# line once the parent catches up and `pnpm audit` stays clean without it.
overrides:
  # waiting on vite
  postcss: "^8.5.23"
  "nanoid@^3": "^3.3.18"
  source-map-js: "^1.2.2"
  # waiting on @tanstack/start-plugin-core > xmlbuilder2
  js-yaml: "^4.3.2"
  # waiting on @vitejs/plugin-react > @babel/core
  browserslist: "^4.28.7"
  baseline-browser-mapping: "^2.11.0"
